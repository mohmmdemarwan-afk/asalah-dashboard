name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare project
        run: |
          unzip -q asalah-android-ready.zip
          cd asalah-final
          npm install
          npm install @capacitor/android@8
          mkdir -p public

          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="ar">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>مفروشات الأصالة</title>
          </head>
          <body></body>
          </html>
          EOF

      - name: Configure Capacitor
        run: |
          cd asalah-final

          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.asalah.furnishings',
            appName: 'مفروشات الأصالة',
            webDir: 'public'
          };

          export default config;
          EOF

      - name: Create Android
        run: |
          cd asalah-final
          npx cap add android

      - name: Sync Android
        run: |
          cd asalah-final
          npx cap sync android

      - name: Configure MainActivity
        run: |
          cd asalah-final

          mkdir -p android/app/src/main/java/com/asalah/furnishings

          cat > android/app/src/main/java/com/asalah/furnishings/MainActivity.java <<'EOF'
          package com.asalah.furnishings;

          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = getBridge().getWebView();
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl(
                    "https://asalah-final-v4-j4c7kptsw-mohmmdemarwan-5295.vercel.app"
                  );
              }
          }
          EOF

      - name: Build APK
        run: |
          cd asalah-final/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asalah-furnishings-apk
          path: asalah-final/android/app/build/outputs/apk/debug/app-debug.apk
